<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kirish</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css" />
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="icon" type="image/png" href="../build/brand_logo.png" />
  </head>

  <body>
    <div class="login-container">
      <div class="text-center mb-3">
        <img src="../img/brand_logo.png" alt="Login Icon" width="100" />
      </div>
      <h2><strong>Kirish</strong></h2>

      <form id="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input
            autocomplete="username"
            type="text"
            id="username"
            name="username"
          />
        </div>

        <div class="form-group password-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input
              autocomplete="current-password"
              type="password"
              id="password"
              name="password"
            />
            <img
              src="../img/icons8-show-50.png"
              alt=""
              id="toggle-password"
              title="Show/Hide Password"
              role="button"
              tabindex="0"
              aria-label="Show password"
              aria-controls="password"
              aria-pressed="false"
            />
          </div>
        </div>

        <div class="remember-me">
          <input type="checkbox" id="remember" class="remember" />
          <label for="remember" class="remember-text">Meni eslab qol</label>
        </div>

        <button type="submit" class="submit-btn">
          <div class="progress-bar"></div>
          <span class="btn-text">Login</span>
        </button>

        <div id="message" class="alert invisible" role="alert"></div>
      </form>

      <div id="info"></div>
    </div>

    <div id="alert-placeholder"></div>
    <script type="module" src="../utils/loadAlert.js"></script>
    <script src="../renderer/loginrenderer.js"></script>
  </body>
</html>
