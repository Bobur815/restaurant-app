<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/template.css">
</head>
<body>
    <div class="header">
        <h1>🍽️ Menu</h1>
        <button class="add-btn">+ Qo'shish</button>
    </div>
    <div class="grid" id="menuGrid">
    
    </div>
    <!-- Modal Forma -->
    <div id="addModal" class="modal hidden">
        <div class="modal-content">
            <h2>Yangi Mahsulot Qo'shish</h2>

            <div class="number-input">
                <input type="text" id="productName" placeholder="Mahsulot nomi">
                <button class="decrement">-</button>
                <input type="number" id="productPrice" value="0" placeholder="Narxi"  min="0">
                <button class="increment">+</button>
            </div>            
            <div id="errorMessage" style="color: red; margin-bottom: 10px; display: none;"></div>

            <div class="image-upload">
                <input type="text" id="productImage" placeholder="Rasm yuklash" readonly>
                <button type="button" id="uploadBtn">Yuklash</button>
                <input type="file" id="realFileInput" accept="image/*" class="hidden-file-input">
            </div>
            
            
            <textarea id="productDesc" placeholder="Tavsif"></textarea><br>
            <button id="saveProduct">Saqlash</button>
            <button id="closeModal">Bekor qilish</button>
            
        </div>
    </div>

</body>
</html>
