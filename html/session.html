<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/sessions.css">
    <title>Smenalar</title>
</head>

<body>
    <div class="header">
        <h1><img src="../img/icons8-session-timeout-50.png" alt=""> Smenalar</h1>
        <button class="add-btn" id="session-open-btn">+ Smenani ochish</button>
    </div>

    <div class="main-div">
        <div class="filter-div">
            <select name="" id="open-date-of-session">
                <option value="" selected disabled hidden>Ochilish sanasini tanlang...</option>
            </select>
            <select name="" id="end-date-of-session" disabled>

            </select>
        </div>

        <div class="table-wrapper">
            <h2>🟢 Ochiq Smenalar</h2>
            <table class="session-table">
                <thead>
                    <tr id="openSessionDate"
                        style=" background-color: rgb(171, 220, 171); padding: 10px 8px; font-size: 17px;"></tr>
                    <tr>
                        <th>№</th>
                        <th>Rasm</th>
                        <th>Nomi</th>
                        <th>Boshlang'ich soni</th>
                        <th>Sotilgani</th>
                        <th>Qoldiq</th>
                    </tr>
                </thead>

                <tbody id="openSessionList">
                    <!-- dynamic rows will be inserted here -->
                </tbody>
            </table>
            <div class="session-actions">
                <button class="session-close-btn"><img src="../img/icons8-finish-100.png" alt=""> Yopish</button>
                <button class="edit-btn">✏️ Tahrirlash</button>
                <button class="delete-btn">🗑️ O'chirish</button>
                <button class="print-btn">🖨️ Chop etish</button>
            </div>
        </div>

        <!-- YOPILGAN SMENALAR WRAPPER -->
        <div class="table-wrapper">
            <h2>🔴 Yopilgan Smenalar</h2>
            <!-- Umumiy header qatlamini ushlab qolamiz -->
            <table class="session-table">
                <thead>
                    <tr id="closeSessionDate"
                        style=" background-color: rgb(171, 220, 171); padding: 10px 8px; font-size: 17px;"></tr>
                    
                </thead>
            </table>

            <!-- Har bir YOPILGAN smena shu konteyner ichida ALOHIDA card/table bo‘lib render qilinadi -->
            <div id="closedSessionsContainer"></div>
        </div>
    </div>

    <script src="../renderer/sessions/render.sessions.js"></script>
</body>

</html>
