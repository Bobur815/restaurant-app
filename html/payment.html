<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8">
  <title>To'lov oynasi</title>
  <link rel="stylesheet" href="../css/payment.css">
  <script type="module" src="../renderer/confirmPayment.js"></script>
</head>

<body>
  <div class="wrap">
    <h2 class="page-title" style="text-align:center; margin: 6px 0 14px;">🧾 Buyurtma tafsilotlari</h2>

    <!-- Action Animation Overlay -->
    <div id="action-anim" class="action-anim hidden">
      <div class="anim-card">
        <div class="anim-icon" id="anim-icon">✔</div>
        <div class="anim-title" id="anim-title">Processing…</div>
        <div class="anim-bar"><span></span></div>
      </div>
    </div>

    <div id="checkPreview">
      <h3 class="brand"></h3>
      <p class="addr"></p>
      <p class="phone"></p>
      <div class="sep" aria-hidden="true">**************************************</div>
    </div>

    <div class="payment-options">
      <h4>To'lov usuli:</h4>
      <label><input type="radio" name="payment" value="cash" checked> Naqd</label>
      <label><input type="radio" name="payment" value="card"> Karta</label>
      <label><input type="radio" name="payment" value="click"> Klik</label>
      <label><input type="radio" name="payment" value="debt"> Nasiya</label>
      <br><br>
      <label><input type="checkbox" id="printCheck"> Checkni chop etish</label>
    </div>

    <button id="confirmPayment">💵 To'lovni tasdiqlash</button>
  </div>


  <script type="module">
    import confirmPayment from "../renderer/confirmPayment.js";

    // ------------ Helpers ------------
    const toNum = (v, d = 0) => {
      const n = Number(v);
      return Number.isFinite(n) ? n : d;
    };
    const money = (n) => toNum(n).toLocaleString('uz-UZ') + " so'm";

    const now = new Date();
    const dateStr = new Intl.DateTimeFormat('uz-UZ', { day: '2-digit', month: '2-digit', year: 'numeric' }).format(now);
    const timeStr = new Intl.DateTimeFormat('uz-UZ', { hour: '2-digit', minute: '2-digit', hour12: false }).format(now);

    // Render a single line with dotted leaders
    function renderLine(container, leftLabel, unitPrice, qty, qtyFactor, subtotal) {
      const row = document.createElement('div');
      row.className = 'li';

      const left = document.createElement('div');
      left.className = 'left';

      const qtyname = document.createElement('div');
      qtyname.className = 'qtyname';
      qtyname.textContent = leftLabel;

      const leaders = document.createElement('div');
      leaders.className = 'leaders';

      // o'ng blok — 2 qatordan iborat
      const right = document.createElement('div');
      right.className = 'price';

      const f = (qtyFactor && qtyFactor !== 1) ? qtyFactor : 1;
      const unitWithFactor = unitPrice * f;

      const calc = document.createElement('div');
      calc.className = 'calc';
      calc.textContent = `${qty} × ${unitWithFactor.toLocaleString('uz-UZ')}`;

      const sub = document.createElement('div');
      sub.className = 'subtotal';
      sub.textContent = `${Number(subtotal).toLocaleString('uz-UZ')} so'm`;


      right.append(calc, sub);

      left.append(qtyname, leaders);
      row.append(left, right);
      container.appendChild(row);
    }


    window.electronAPI.onLoadOrder((orderData) => {
      const brandName = document.querySelector('.brand');
      const addr = document.querySelector('.addr');
      const phone = document.querySelector('.phone');
      const preview = document.getElementById("checkPreview");
      const printBox = document.getElementById("printCheck");
      const confirmBtn = document.getElementById("confirmPayment");

      const footNote = document.createElement('footer')
      footNote.className = 'footNote'
      // ---- Header (brand/address/phone/footer) ----
      const setText = (el, text) => { if (el) el.textContent = text ?? ""; };

      (async () => {
        try {
          const res = await fetch("http://localhost:3000/api/receipt-settings", {
            headers: { "Accept": "application/json" }
          });
          const data = res.ok ? await res.json() : null;

          const restaurantName = data?.restaurantName ?? orderData?.brand ?? "Oshxona";
          const address = data?.address ?? "";
          const phoneNum = data?.phone ?? "";
          const footerNote = data?.footerNote ?? "";

          setText(brandName, restaurantName);
          setText(addr, address);
          setText(phone, `${phoneNum}`);
          // Use textContent for safety. If you want rich HTML (e.g., <br>), sanitize then use innerHTML.
          setText(footNote, `***** ${footerNote} *****`);
        } catch (e) {
          // Fallbacks if settings API is unavailable
          setText(brandName, orderData?.brand ?? "Restoran");
          setText(addr, "");
          setText(phone, "");
          setText(footNote, "");
        }
      })();


      // ---- Header meta ----
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.innerHTML = `
        <div><b>Stol:</b> ${orderData.table_number}</div>
        <div style="text-align:right;"><b>Buyurtma:</b> #${orderData.orderId}</div>
        <div><b>Sana:</b> ${dateStr}</div>
        <div style="text-align:right;"><b>Soat:</b> ${timeStr}</div>
      `;
      preview.appendChild(meta);
      preview.appendChild(document.createElement('hr'));
      preview.appendChild(document.createElement('hr'));
      // ---- Items ----
      const itemsBox = document.createElement('div');
      itemsBox.className = 'items';

      let total = 0;

      (orderData.items || []).forEach((it, index) => {
        const name = String(it.name || '').trim();
        const qty = Math.max(0, toNum(it.quantity, 0));                 // qty (dona yoki kg birligi)
        const unitPrice = toNum(it.price, 0);
        const portion = it.portions != null ? toNum(it.portions, 1) : 1; // non-weight: 1/0.7/0.5
        const weight = it.weight_kg != null ? toNum(it.weight_kg, 1) : (it.weightValue != null ? toNum(it.weightValue, 1) : 1);
        // Agar weight_kg mavjud bo'lsa (kilolik), faktor = weight; bo'lmasa portions
        const factor = (weight && weight !== 1) ? weight : portion;

        // Subtotal: qty × factor × unit_price
        const lineSubtotal = qty * factor * unitPrice;
        total += lineSubtotal;

        index += 1;  // 1 dan boshlash uchun
        // Chap label: "qty × name" va agar factor ≠ 1 bo'lsa, qo'shimcha "(factor)" ni ko'rsatamiz
        const leftLabel = (factor && factor !== 1)
          ? `${index}. ${name} (${factor}) \n\t${qty} × ${unitPrice * factor}`
          : `${index}. ${name} \n\t${qty} × ${unitPrice}`;

        renderLine(itemsBox, leftLabel, unitPrice, qty, (factor !== 1 ? factor : 1), lineSubtotal);
      });

      preview.appendChild(itemsBox);
      preview.appendChild(document.createElement('hr'));
      preview.appendChild(document.createElement('hr'));

      // Total purchase
      const totalLabel = document.createElement('div');
      totalLabel.className = 'total-label';
      totalLabel.style = "font-weight: 600; font-size: 14px";
      totalLabel.textContent = `Pozitsiyalar: ${(orderData.items || []).length}`;
      preview.appendChild(totalLabel);

      preview.appendChild(document.createElement('hr'));
      preview.appendChild(document.createElement('hr'));
      // ---- Total row ----
      const totalRow = document.createElement('div');
      totalRow.className = 'total-row';
      totalRow.innerHTML = `
        <div class="label">Jami to'lovga:</div>
        <div class="leaders"></div>
        <div class="amount">${money(total)}</div>
      `;
      preview.appendChild(totalRow);

      // formadan tanlangan to'lov usulini olish
      const selectedPayment = document.querySelector('input[name="payment"]:checked')?.value || 'cash';

      const paymentMap = {
        cash: "Naqd",
        card: "Karta",
        click: "Klik",
        debt: "Nasiya"
      };
      // previewga chiqarish
      const paymentMethods = document.createElement('div');
      paymentMethods.className = 'payment-methods';
      paymentMethods.innerHTML = `
  <div class="label">To'lov usuli:</div>
  <div class="method-row"> 
      <p class="method"> · ${paymentMap[selectedPayment]}</p>
    <div class="leaders"></div>
    <p class="amount">= ${money(total)}</p>
  </div> 
`;

      preview.appendChild(paymentMethods);


      preview.appendChild(document.createElement('hr'));
      preview.appendChild(document.createElement('hr'));
      preview.appendChild(footNote)

      // ---- Confirm handler ----
      confirmBtn.addEventListener("click", async () => {
        const checkedRadio = document.querySelector('input[name="payment"]:checked');
        const paymentMethod = checkedRadio?.value || 'cash';

        // backendga tasdiqlash
        await confirmPayment(orderData, paymentMethod);

        if (printBox.checked) {

          orderData.brand = brandName.textContent;
          orderData.address = addr.textContent;
          orderData.phone = phone.textContent;
          orderData.footNote = footNote.textContent;

          window.electronAPI.sendPrint({ order: orderData, paymentMethod });
        }
        window.electronAPI.confirmPayment();
        window.close();
      });
    });
  </script>
  <script type="module" src="../utils/loadAnimation.js"></script>
  <script type="module" src="../utils/alert.js"></script>
</body>

</html>
