<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="../css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/login.css" />
  <link rel="icon" type="image/png" href="../build/brand_logo.png">
</head>

<body>
  <div class="login-container">
    <div class="text-center mb-3">
      <img src="../img/login_icon.png" alt="Login Icon" width="100">
    </div>
    <h2>Login</h2>

    <form id="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input autocomplete="username" type="text" id="username" name="username" />
      </div>

      <div class="form-group password-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input autocomplete="current-password" type="password" id="password" name="password" />
          <button type="button" id="toggle-password" title="Show/Hide Password">👁️</button>
        </div>
      </div>

      <div id="message" class="alert d-none" role="alert"></div>
      <button type="submit" class="submit-btn">
        <div class="progress-bar"></div>
        <span class="btn-text">Login</span>
      </button>

    </form>

    <div id="info"></div>
  </div>

  <div id="alert-placeholder"></div>
  <script type="module" src="../utils/loadAlert.js"></script>
  <script src="../renderer/loginrenderer.js"></script>
</body>

</html>
