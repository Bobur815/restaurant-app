  <h1 class="setting-title">⚙️ Settings</h1>

  <div class="settings-grid" id="settingsGrid">
    <!-- Profile -->
    <section class="section" id="profileSection">
      <div class="profile-title">
        <img src="../img/icons8-profile-48.png" alt="profile">
        <h2>Profil</h2>
      </div>
      <form id="profileForm" class="rows" autocomplete="off">

        <div class="row">
          <label for="username">Login</label>
          <input id="username" name="username" type="text" placeholder="Username">
        </div>

        <div class="row">
          <label for="current-password">Joriy parol</label>
          <input id="current-password" name="current-password" type="password" readonly>
        </div>

        <div class="row">
          <label for="newPassword">Yangi parol</label>
          <input id="newPassword" name="newPassword" type="password" placeholder="Yangi parol">
        </div>

        <div class="row">
          <label for="confirmPassword">Yangi parol (tasdiq)</label>
          <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Yangi parolni takrorlang">
        </div>

        <div class="actions">
          <button type="button" class="btn secondary" id="profileReset">Bekor</button>
          <button type="submit" class="btn" id="profileSave">Saqlash</button>
        </div>
      </form>
    </section>

    <!-- Receipt Settings -->
    <section class="section" id="receiptSection">
      <h2>🧾 Chek sozlamalari</h2>
      <form id="receiptForm" class="rows" autocomplete="off">
        <div class="row">
          <label for="restaurantName">Restaurant nomi</label>
          <input id="restaurantName" name="restaurantName" type="text" placeholder="Shoxona Milliy Taomlar">
        </div>

        <div class="row">
          <label for="address">Manzil</label>
          <textarea id="address" name="address" placeholder="Arabmozor, Toshloq, Farg‘ona"></textarea>
        </div>

        <div class="row">
          <label for="phone">Telefon</label>
          <input id="phone" name="phone" type="text" placeholder="+998 90 123 45 67">
        </div>

        <div class="row">
          <label for="footerNote">Chek pastidagi izoh</label>
          <textarea id="footerNote" name="footerNote" placeholder="Rahmat! Yana kutib qolamiz."></textarea>
        </div>

        <div class="actions">
          <button type="button" class="btn secondary" id="receiptReset">Bekor</button>
          <button type="submit" class="btn" id="receiptSave">Saqlash</button>
        </div>
      </form>
    </section>
  </div>

  <div id="alert-placeholder"></div>
