<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/hisobotlar.css">
</head>
<body>
    <h1>📊 Hisobotlar</h1>
    <div class="report-controls">
      <label>
        <select id="reportType">
          <option value="daily">Kunlik</option>
          <option value="weekly">Haftalik</option>
          <option value="monthly">Oylik</option>
          <option value="yearly">Yillik</option>
          <option value="fromMonth">Oy boshidan</option>
          <option value="fromYear">Yil boshidan</option>
          <option value="custom">Moslashuvchan</option>
        </select>
      </label>

    
      <!-- shown only when “custom” is selected -->
      <input type="date" id="startDate" disabled/>
      <input type="date" id="endDate"  disabled/>
    
      <button id="generateBtn">🔍 Ko‘rsatish</button>
      <button id="printBtn">🖨️ Chop etish</button>
    </div>
    
    <div id="reportResult">
      <!-- we'll inject a table (and optionally a chart) here -->
    </div>
    
    <div class="charts">
      <canvas id="salesChart" width="400" height="200"></canvas>
      <canvas id="productPieChart" width="400" height="200"></canvas>
    </div>

    <div id="alert-placeholder"></div>
    <script src="../node_modules/chart.js/dist/chart.umd.js"></script>
    <script src="./reports.js"></script>
  <script type="module" src="../utils/loadAlert.js"></script>
</body>
</html>
