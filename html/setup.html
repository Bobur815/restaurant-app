<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8" />
    <title>Sozlamalar</title>
    <link rel="stylesheet" href="../css/setup.css">
</head>

<body>
    <h1>🛠️ Dastlabki sozlash</h1>

    <form id="setupForm" novalidate>
        <div class="card">
            <h3>👤 Admin profil</h3>
            <div class="row">
                <label for="username">Username</label>
                <input id="username" required placeholder="admin">
            </div>
            <div class="row">
                <label for="password">Parol</label>
                <input id="password" type="password" required placeholder="••••••••">
            </div>
            <div class="row">
                <label for="password2">Parol (tasdiqlash)</label>
                <input id="password2" type="password" required placeholder="••••••••">
            </div>
        </div>

        <div class="card">
            <h3>🧾 Oshxona ma'lumotlari</h3>
            <div class="row">
                <label for="restaurantName">Restaurant nomi</label>
                <input id="restaurantName" required placeholder="Shoxona Milliy Taomlar">
            </div>
            <div class="row">
                <label for="address">Manzil</label>
                <textarea id="address" required placeholder="Arabmozor, Toshloq, Farg‘ona"></textarea>
            </div>
            <div class="row">
                <label for="phone">Telefon</label>
                <input id="phone" required placeholder="+998 90 123 45 67">
            </div>
            <div class="row">
                <label for="footerNote">Chek pastidagi izoh</label>
                <textarea id="footerNote" placeholder="Rahmat! Yana kutib qolamiz."></textarea>
            </div>
        </div>

        <div class="actions">
            <button class="btn" id="btnSubmit" type="submit">Saqlash va davom etish</button>
        </div>

        <div id="alert" class="alert"></div>
    </form>

    <script type="module">
        const f = document.getElementById('setupForm');
        const btn = document.getElementById('btnSubmit');
        const alertBox = document.getElementById('alert');

        const adminCard = document.querySelector('.card:nth-of-type(1)');
        const receiptCard = document.querySelector('.card:nth-of-type(2)');

        function show(type, msg) {
            alertBox.className = 'alert ' + (type === 'ok' ? 'ok' : 'err');
            alertBox.textContent = msg;
            alertBox.style.display = 'block';
        }

        function toggleSection(cardEl, enabled) {
            cardEl.style.display = enabled ? '' : 'none';
            cardEl.querySelectorAll('input, textarea, select').forEach(el => {
                if (enabled) {
                    // faqat admin card uchun required’larni qayta yoqamiz
                    // (pastda aniq maydonlar uchun qo‘shimcha qo‘yamiz)
                    el.disabled = false;
                } else {
                    el.disabled = true;
                    el.required = false;
                }
            });
        }

        // --- Sahifa ochilganda statusni tekshir
        let needAdmin = true;
        let needReceipt = true;

        try {
            const st = await window.electronAPI.getSetupStatus(); // { adminExists, receiptExists, setupComplete }
            needAdmin = !st.adminExists;
            needReceipt = !st.receiptExists;

            // 🔒 Ko‘rinmaydigan karta inputlari disabled bo‘lsin (native validationga tushmasin)
            toggleSection(adminCard, needAdmin);
            toggleSection(receiptCard, needReceipt);

            // Kerakli required’larni qayta yoqish (faqat ko‘rinadigan qism uchun)
            if (needAdmin) {
                document.getElementById('username').required = true;
                document.getElementById('password').required = true;
                document.getElementById('password2').required = true;
            }
            if (needReceipt) {
                document.getElementById('restaurantName').required = true;
                document.getElementById('address').required = true;
                document.getElementById('phone').required = true;
                // footerNote ixtiyoriy
            }

            // Tugma yozuvi
            if (needAdmin && needReceipt) btn.textContent = "Saqlash va davom etish";
            else if (needAdmin) btn.textContent = "Admin yaratish";
            else if (needReceipt) btn.textContent = "Sozlamalarni saqlash";
            else {
                // Teoretik: bu sahifaga tushmaslik kerak edi
                alertBox.className = 'alert ok';
                alertBox.textContent = "Setup tugallangan.";
                alertBox.style.display = 'block';
            }
        } catch (e) {
            console.error('status err:', e);
            alertBox.className = 'alert err';
            alertBox.textContent = "Holatni tekshirishda xatolik.";
            alertBox.style.display = 'block';
        }

        document.getElementById('username').setAttribute('name', 'username');
        document.getElementById('password').setAttribute('name', 'password');
        document.getElementById('password2').setAttribute('name', 'password2');
        document.getElementById('restaurantName').setAttribute('name', 'restaurantName');
        document.getElementById('address').setAttribute('name', 'address');
        document.getElementById('phone').setAttribute('name', 'phone');
        document.getElementById('footerNote').setAttribute('name', 'footerNote');


        f.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBox.style.display = 'none';

            // Admin maydonlari
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const password2 = document.getElementById('password2').value;

            // Receipt maydonlari
            const restaurantName = document.getElementById('restaurantName').value.trim();
            const address = document.getElementById('address').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const footerNote = document.getElementById('footerNote').value.trim();

            // Faqat keraklisini validatsiya qilamiz
            if (needAdmin) {
                if (!username || !password || !password2) {
                    return show('err', 'Username va parollarni to‘ldiring.');
                }
                if (password !== password2) {
                    return show('err', 'Parollar mos emas.');
                }
            }
            if (needReceipt) {
                if (!restaurantName || !address || !phone) {
                    return show('err', 'Restaurant nomi, manzil va telefonni to‘ldiring.');
                }
            }

            btn.disabled = true;
            try {
                const payload = {
                    // admin qismi bo‘lmasa ham jo‘natish xavfsiz — backend status asosida qaror qiladi
                    username, password,
                    restaurantName, address, phone, footerNote
                };
                const res = await window.electronAPI.submitSetup(payload);
                if (res?.ok) {
                    show('ok', 'Sozlamalar saqlandi. Dastur ochilmoqda...');
                    setTimeout(() => window.electronAPI.setupDone(), 600);
                } else {
                    show('err', 'Saqlashda xatolik.');
                }
            } catch (e) {
                show('err', e.message || 'Saqlashda xatolik.');
            } finally {
                btn.disabled = false;
            }
        });
    </script>

</body>

</html>
