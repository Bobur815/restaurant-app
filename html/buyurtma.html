<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/buyurtma.css">
</head>
<body>
    <!-- Dinamik Header -->
    <div class="order-header">
        <button class="back-btn" id="backButton" style="display:none;">
            <img src="../img/back-icon.png" alt="Orqaga" width="16"> Orqaga
        </button>
        <h1 id="pageTitle">🛒 Buyurtma</h1>
        
    </div>

    <div class="table-wrapper">
        <h2>Stollar</h2>
        <div class="table-grid" id="tableGrid">
            <!-- Dinamik stollar shu yerda -->
        </div>
    </div>

    <!-- Asosiy Kontent -->
    <div class="container" style="display: none;">

        <!-- O'rtadagi Tanlangan Mahsulotlar -->
        <div class="selected-products">
            <div class="products-header">
                <h2>Tanlangan Mahsulotlar</h2>
                <span id="tableNumber" style="display:none; font-size:18px; font-weight:bold;"></span>
            </div>
        
            <!-- Jadval scroll qilinadigan qism -->
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Rasm</th>
                            <th>Nomi</th>
                            <th>Narxi</th>
                            <th>Soni</th>
                            <th>Porsiya</th>
                            <th>Jami</th>
                            <th>O'chirish</th>
                        </tr>
                    </thead>
                    <tbody id="orderTableBody">
                        <!-- JS orqali tanlangan mahsulotlar qo'shiladi -->
                    </tbody>
                </table>
            </div>
        
            <!-- Pastki panel -->
            <div class="order-footer">
                <h2 class="total-wrapper">
                    Jami: <span id="grandTotal">0 UZS</span>
                </h2>
                <div class="order-buttons">
                    <button class="order-btn">Buyurtma berish</button>
                    <button class="pay-btn" disabled>To'lov qilish</button>
                    <button class="cancel-order" disabled>Bekor qilish</button>
                </div>
            </div>
        </div>
        

        <!-- O'ng Panel (Menu) -->
        <div class="order-sidebar" id="sidebar">
            <h3>📋 Menu</h3>
            <select id="productCategory">
                
            </select>
            <ul id="menuList">
                <!-- Mahsulotlar ro'yxati -->
            </ul>
        </div>
    </div>
    <div id="alert-placeholder"></div>
  <script type="module" src="../renderer/loadAlert.js"></script>
</body>
</html>
